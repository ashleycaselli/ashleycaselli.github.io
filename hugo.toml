baseURL = 'https://ashleycaselli.github.io/'
locale = 'en-us'
title = 'Ashley Caselli'

disableKinds = ['rss']

# An events page is a page of pages dated in the future, and Hugo leaves those
# out of a build unless told otherwise. Without this every event that has not
# happened yet — which is the entire point of the section — is silently dropped.
buildFuture = true

# ---------------------------------------------------------------------------
# The theme comes from the published module rather than a sibling directory.
# `hugo mod get github.com/Nanopublication/nanopub-hugo` pins the version in
# go.mod; `hugo mod get -u` moves it forward. Needs a Go toolchain.
# ---------------------------------------------------------------------------
[[module.imports]]
path = 'github.com/Nanopublication/nanopub-hugo'

# ---------------------------------------------------------------------------
# REQUIRED. resources.GetRemote refuses any media type not on this allowlist,
# and Hugo does not let a module contribute it — see the README.
# Do not anchor with $: responses carry a ";charset=UTF-8" suffix.
# ---------------------------------------------------------------------------
# The news bodies carry markup. Hugo denies text/html from a content adapter by
# default; allowing it is a deliberate trust decision about the source space.
# Drop this block and set `contentPlain = true` on the news section instead if
# you would rather strip tags than trust the publisher.
[security]
allowContent = ['^text/html$', '^text/markdown$']

[security.http]
mediaTypes = ['^application/ld\+json', '^application/sparql-results\+json']

# ---------------------------------------------------------------------------
# Hugo caches resources.GetRemote forever by default (maxAge = -1), so an empty
# or failed result for a query gets pinned and no plain `hugo` run ever asks
# again — the section just stays empty. Expire it daily instead: a nightly
# rebuild picks up new nanopubs, and a cached copy still covers a network
# failure within the window.
# ---------------------------------------------------------------------------
[caches.getresource]
maxAge = '24h'

[taxonomies]
venue = 'venues'
role = 'roles'

[params]
description = 'Personal website, built from the nanopublication network.'

# A path under assets/, processed by Hugo into 1x and 2x copies. Takes
# precedence over the profile picture the network records for this ORCID;
# remove it and the header falls back to whatever `get-all-user-profile-pics`
# returns.
avatar = 'img/avatar.png'

# The home-page headline. Each entry is either a role — rendered as
# "Role · Organisation", with the organisation linked when `href` is set — or a
# free-form `text` line. Set `tagline` instead for a single sentence; both
# render if both are set.
highlights = [
  { role = 'Knowledge/Software Engineer', org = 'Knowledge Pixels', href = 'https://knowledgepixels.com/' },
  { role = 'Lecturer', org = 'University of Geneva', href = 'https://www.unige.ch/' },
  { role = 'Maintainer', org = 'TopBraid SHACL API', href = 'https://github.com/TopQuadrant/shacl' },
#  { text = 'Nanopublications, FAIR data, and the semantic web (SHACL)' },
]

# `icon` names a mark in layouts/_partials/icon.html — github, linkedin, orcid,
# and email are drawn as SVG. Any other value is rendered as literal text, so a
# character like '✉' still works for a link with no mark of its own.
[[params.links]]
label = 'Email'
href = 'mailto:ashley@knowledgepixels.com'
icon = 'email'
[[params.links]]
label = 'ORCID'
href = 'https://orcid.org/0000-0001-8492-0354'
icon = 'orcid'
[[params.links]]
label = 'GitHub'
href = 'https://github.com/ashleycaselli'
icon = 'github'
# From this ORCID's own personal-URL nanopublication (get-personal-urls).
[[params.links]]
label = 'LinkedIn'
href = 'https://www.linkedin.com/in/ashleycaselli/'
icon = 'linkedin'

# ---------------------------------------------------------------------------
# Everything below is the whole content model. Connect views, get a website.
#
# Each section names a `view` — a view nanopublication already published in the
# network, which says which query to run and which of its parameters carries the
# subject. The view's own title and structural position are ignored: what a
# section is called and where it sits is this site's business, so `title` and
# `weight` stay here. Use `query` instead of `view` to name a query directly.
# ---------------------------------------------------------------------------
[params.nanopub]
endpoint = 'https://query.knowledgepixels.com/'
nanodash = 'https://nanodash.knowledgepixels.com/'
orcid = 'https://orcid.org/0000-0001-8492-0354'
verbose = true

# A row whose label is missing has nothing to be a page about, and the
# attendance view returns bare event URIs whenever the attendance was recorded
# without one. This query reads the label off the event itself, which is where
# the attendance query already goes for the start date.
labelQuery = 'https://w3id.org/np/RAtftxAXJubB4rlm9fOvvHNVIkXvWQLC6Ag_MiV7HL0ow/get-labels-for-thing'

# The Events page is the one section this site builds itself, in
# content/events/_content.gotmpl: it merges two views into a single page —
# the events I plan to attend and the ones I am only watching — and fills in
# the event labels the attendance view leaves empty. `sourcedLocally` tells the
# module's adapter to leave the section alone so the rows are not fetched
# twice; see layouts/_partials/nanopub/section-source.html.
[[params.nanopub.sections]]
id = 'events'
title = 'Events'
blurb = 'Conferences and meetings, taken straight from the network.'
empty = 'Nothing coming up.'
weight = 4
sourcedLocally = true
# Named here rather than in the templates: the adapter, the page layout and the
# footer's provenance list all walk the same groups, in this order.
groups = ['attending', 'interested']

# Each group names its own view. `fields.date` carries a single day;
# `fields.dateRange` carries a "start – end" literal, which is what the
# observed-events query returns. A group sets one or the other.
[params.nanopub.sections.attending]
title = 'Attending'
blurb = 'Where you can find me next.'
empty = 'No upcoming events planned.'
view = 'https://w3id.org/np/RA8Qth9x0Tl-GJGxFULfqNMyXJ7yorqdXBXH5Xek4ZxY8'
[params.nanopub.sections.attending.fields]
title = 'event_label'
link = 'event'
date = 'date'

[params.nanopub.sections.interested]
title = 'Interested in'
blurb = 'Events I am keeping an eye on.'
empty = 'Nothing on the radar right now.'
view = 'https://w3id.org/np/RArRGdhEEEri5eIPUX-yGoRLdxPm4MJPlFjqIrCdoqcHY'
[params.nanopub.sections.interested.fields]
title = 'event_label'
link = 'event'
dateRange = 'dates'


# Facts a view does not carry, read from the thing's own nanopublication. Each
# one names a published query, which of its parameters take which binding of the
# row being enriched, the property whose row to pick out of the query's
# key-value answer, and the variable holding the value. Adding a fact is a block
# here and a line in the template — no template logic.
[params.nanopub.sections.facts.location]
query = 'https://w3id.org/np/RA2Oiy7ht4NcXjJr8mb-hgpVc1vwmUFyaypoll-XvPKso/get-time-limited-space-info'
match = ['http://schema.org/location', 'https://schema.org/location']
matchField = 'Property_noheader'
valueField = 'Value_multi_val_noheader'
[params.nanopub.sections.facts.location.params]
resource = 'event'

# The event's own identifier elsewhere — its website, in practice. `get-space-info`
# renders this one as an HTML anchor for display; row-fact.html unwraps it.
[params.nanopub.sections.facts.altId]
query = 'https://w3id.org/np/RAE47ty6qDLpysySankxy37Bn5RBT273lKcIbTtAdDtQo/get-space-info'
match = ['http://www.w3.org/2002/07/owl#sameAs']
matchField = 'Property_noheader'
valueField = 'Value_noheader'
[params.nanopub.sections.facts.altId.params]
space = 'event'

[[params.nanopub.sections]]
id = 'publications'
title = 'Publications'
blurb = 'Papers I have authored, as recorded in the nanopublication network.'
empty = 'No papers linked to this ORCID in the network yet.'
weight = 1
view = 'https://w3id.org/np/RAR5QfVtTglBt4tuOYnlH6zs6MkLlYrFrMVYFrVGZOBJA/papers-for-author-view'
[params.nanopub.sections.fields]
title = 'paper_label'
date = 'publication_date'
link = 'paper'
summary = 'journal_label'
[params.nanopub.sections.taxonomies]
venues = 'journal_label'

# A live section: queried in the browser on every visit, never built into the
# HTML. Use this where freshness matters more than indexability.
[[params.nanopub.sections]]
id = 'activity'
title = 'Activity'
blurb = 'Everything I have published to the network — queried live, in your browser.'
weight = 5
mode = 'live'
limit = 15
view = 'https://w3id.org/np/RAZse-1U8VD7qGWkFwLa2eu9gC6raGUL0z6bmSD711YTA/latest-nanopubs-by-user-view'
[params.nanopub.sections.fields]
title = 'label'
date = 'date'

# Built by content/talks/_content.gotmpl for the same reason Events is: the view
# returns a title and little else. The query asks for the date under dct:date
# and for the event's label inside the presentation's own assertion, and the
# presentations in the network carry neither — the date is schema:startDate on
# the presentation, and the label belongs to the event's space declaration. Both
# are filled in below, which is also where the location comes from.
[[params.nanopub.sections]]
id = 'talks'
title = 'Talks'
blurb = 'Talks I have given, and the ones already scheduled.'
empty = 'No talks linked to this ORCID in the network yet.'
weight = 2
sourcedLocally = true
view = 'https://w3id.org/np/RAq02zzyspzoN3I-ViEWKxtQfDAsCyNswKW1fzbA-02Xc/presentations-view'
[params.nanopub.sections.fields]
title = 'presentation_label'
link = 'presentation'
event = 'event'
# Not a binding of the view's own result — the name of the fact below, which the
# adapter merges into the row before reading the fields.
date = 'startDate'

[params.nanopub.sections.facts.startDate]
query = 'https://w3id.org/np/RAnIK9yRZrmpJjCqrmyb_Dt--89qjEO2Jkt0EJrPVINzs/get-presentation-details'
match = ['http://schema.org/startDate', 'https://schema.org/startDate']
matchField = 'property'
valueField = 'value'
[params.nanopub.sections.facts.startDate.params]
resourceNp = 'np'
resource = 'presentation'

# A place name here, not a URL — a presentation records where it was given as
# text, which is the one thing the event spaces do not do.
[params.nanopub.sections.facts.location]
query = 'https://w3id.org/np/RAnIK9yRZrmpJjCqrmyb_Dt--89qjEO2Jkt0EJrPVINzs/get-presentation-details'
match = ['http://schema.org/location', 'https://schema.org/location']
matchField = 'property'
valueField = 'value'
[params.nanopub.sections.facts.location.params]
resourceNp = 'np'
resource = 'presentation'