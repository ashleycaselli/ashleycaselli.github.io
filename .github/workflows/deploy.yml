name: Deploy

on:
  push:
    branches: [ master ]
  # New nanopublications appear without a commit, so rebuild on a timer too.
  # The getresource cache is set to maxAge = '24h' in hugo.toml, which is what
  # makes a daily run actually re-ask the endpoint rather than serve the cache.
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race. `cancel-in-progress: false` because cancelling a
# half-finished deploy is worse than queuing behind it.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  # renovate: datasource=github-releases depName=gohugoio/hugo
  HUGO_VERSION: 0.165.0
  HUGO_CACHEDIR: ${{ github.workspace }}/.hugo_cache

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      # `extended`, not plain: the avatar is cropped and re-encoded at build
      # time, and the plain build cannot do image processing.
      - name: Install Hugo extended ${{ env.HUGO_VERSION }}
        run: |
          set -euo pipefail
          deb="hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          curl -fsSL -o "${RUNNER_TEMP}/${deb}" \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/${deb}"
          sudo dpkg -i "${RUNNER_TEMP}/${deb}"
          hugo version

      - name: Restore Hugo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.HUGO_CACHEDIR }}
          key: hugo-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ github.run_id }}
          restore-keys: |
            hugo-${{ runner.os }}-${{ hashFiles('go.sum') }}-
            hugo-${{ runner.os }}-

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Build
        run: hugo --minify --gc

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
